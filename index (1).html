<!DOCTYPE html>
 <html lang="id">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Selamat Menikmati</title>
   <style>
     * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
     }
     body {
       background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
       min-height: 100vh;
       font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       color: #fff;
       padding: 20px;
     }
     /* 📝 Judul Halaman */
     .page-title {
       font-size: 22px;
       font-weight: 600;
       color: #fff;
       margin-bottom: 15px;
       text-align: center;
     }
     /* 🖼️ Bingkai Utama */
     .main-frame {
       width: 100%;
       max-width: 500px;
       border: 2px solid #ff8c00;
       border-radius: 16px;
       padding: 30px 25px;
       background: #000;
       box-shadow: 
         0 0 25px rgba(255, 140, 0, 0.2),
         0 10px 40px rgba(0, 0, 0, 0.6);
       display: flex;
       flex-direction: column;
       align-items: center;
     }
     /* 🔗 Link Klik Disini */
     .top-link {
       color: #ff9f29;
       font-size: 17px;
       margin-bottom: 25px;
       text-decoration: none;
       font-weight: 500;
       transition: all 0.3s ease;
     }
     .top-link:hover {
       color: #ffcc00;
       text-decoration: underline;
     }
     /* 🎬 Pembungkus Video */
     .video-container {
       position: relative;
       width: 100%;
       aspect-ratio: 16/9;
       display: flex;
       align-items: center;
       justify-content: center;
       background: #000;
       margin-bottom: 25px;
       border-radius: 8px;
       overflow: hidden;
     }
     video {
       width: 100%;
       height: 100%;
       display: none;
       background: #000;
     }
     /* ▶️ Pembungkus Tombol Play & Garis */
     .play-section {
       position: absolute;
       top: 50%;
       left: 50%;
       transform: translate(-50%, -50%);
       display: flex;
       flex-direction: column;
       align-items: center;
       cursor: pointer;
       z-index: 10;
     }
     /* 🔘 Tombol Play dengan Efek Cahaya */
     .play-btn {
       width: 110px;
       height: 110px;
       border-radius: 50%;
       background: linear-gradient(135deg, #ff8c00, #ff6a00);
       border: none;
       color: white;
       font-size: 40px;
       cursor: pointer;
       display: flex;
       align-items: center;
       justify-content: center;
       transition: all 0.3s ease;
       
       /* ✨ Efek Cahaya Berdenyut */
       box-shadow: 
         0 0 15px rgba(255, 140, 0, 0.6),
         0 0 30px rgba(255, 110, 0, 0.4),
         0 0 45px rgba(255, 110, 0, 0.2),
         inset 0 2px 10px rgba(255, 255, 255, 0.2);
       animation: glowPulse 2.5s ease-in-out infinite;
     }
     .play-btn:hover {
       transform: scale(1.08);
     }
     @keyframes glowPulse {
       0% {
         box-shadow: 
           0 0 15px rgba(255, 140, 0, 0.6),
           0 0 30px rgba(255, 110, 0, 0.4),
           0 0 45px rgba(255, 110, 0, 0.2),
           inset 0 2px 10px rgba(255, 255, 255, 0.2);
       }
       50% {
         box-shadow: 
           0 0 20px rgba(255, 140, 0, 0.7),
           0 0 40px rgba(255, 110, 0, 0.5),
           0 0 60px rgba(255, 110, 0, 0.3),
           inset 0 2px 10px rgba(255, 255, 255, 0.25);
       }
       100% {
         box-shadow: 
           0 0 15px rgba(255, 140, 0, 0.6),
           0 0 30px rgba(255, 110, 0, 0.4),
           0 0 45px rgba(255, 110, 0, 0.2),
           inset 0 2px 10px rgba(255, 255, 255, 0.2);
       }
     }
     /* 📐 Garis Bergerak Maju-Mundur */
     .moving-line-container {
       width: 140px;
       height: 3px;
       margin-top: 22px;
       overflow: hidden;
       border-radius: 3px;
       background: rgba(255, 160, 41, 0.15);
     }
     .moving-line {
       height: 100%;
       width: 50px;
       background: linear-gradient(90deg, transparent, #ff9f29, #ffcc00, #ff9f29, transparent);
       border-radius: 3px;
       animation: moveLine 4s ease-in-out infinite;
     }
     @keyframes moveLine {
       0% { transform: translateX(-50px); }
       50% { transform: translateX(140px); }
       100% { transform: translateX(-50px); }
     }
     /* 🎬 Tombol Tonton Sekarang */
     .cta-button {
       display: block;
       width: 200px;
       background: linear-gradient(135deg, #ff8c00, #ff6a00);
       color: white;
       text-align: center;
       padding: 13px 20px;
       border-radius: 10px;
       text-decoration: none;
       font-weight: 600;
       font-size: 16px;
       transition: all 0.3s ease;
       box-shadow: 0 4px 15px rgba(255, 110, 0, 0.25);
     }
     .cta-button:hover {
       transform: translateY(-2px);
       box-shadow: 0 6px 20px rgba(255, 110, 0, 0.4);
     }
   </style>
 </head>
 <body>
   <!-- 📝 Judul -->
   <h1 class="page-title">Selamat Menikmati</h1>
   <!-- 🖼️ Bingkai Utama -->
   <div class="main-frame">
     
     <!-- 🔗 Klik Disini -->
     <a href="https://childrendreami.com?TMPVO=1734799" target="_blank" class="top-link">👉 Klik Disini</a>
     <!-- 🎬 Area Video -->
     <div class="video-container">
       <video id="videoPlayer" preload="none" playsinline controls>
         <source src="https://cdn2.aceimg.com/455d90da7.mp4" type="video/mp4">
         Maaf, browser kamu tidak mendukung video
       </video>
       
       <!-- ▶️ Tombol Play + Garis Bergerak -->
       <div class="play-section" id="playOverlay">
         <button class="play-btn">▶</button>
         <div class="moving-line-container">
           <div class="moving-line"></div>
         </div>
       </div>
     </div>
     <!-- 🎬 Tonton Sekarang -->
     <a href="https://childrendreami.com?CXRZg=1734796" target="_blank" class="cta-button">Tonton Sekarang</a>
   </div>
 <script>
   const video = document.getElementById('videoPlayer');
   const playOverlay = document.getElementById('playOverlay');
   const IKLAN_URL = 'https://childrendreami.com?bt5ka=1734795'; // Ganti link iklan kamu di sini ya!
   // ✅ Klik tombol play → tampilkan dan putar video di halaman
   playOverlay.addEventListener('click', function() {
     video.style.display = 'block';
     video.muted = false;
     video.play().then(() => {
       playOverlay.style.display = 'none'; // sembunyikan tombol play saat video berjalan
     }).catch(err => {
       alert('Klik tombol play sekali lagi ya! 😊');
     });
   });
   // ✅ Saat video dijeda → buka link iklan
   video.addEventListener('pause', function() {
     playOverlay.style.display = 'flex'; // tampilkan tombol play lagi
     window.open(IKLAN_URL, '_blank'); // buka link iklan di tab baru
   });
   // Saat video diputar → sembunyikan tombol play
   video.addEventListener('play', function() {
     playOverlay.style.display = 'none';
   });
 </script>
 </body>
 </html>
